spring.application.name=quiniela-api

# Variables locales opcionales (no se suben a git): backend/.env
spring.config.import=optional:file:.env[.properties]

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiniela}
spring.datasource.username=${DB_USER:quiniela}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja Flyway (db/migration). Hibernate nunca crea ni altera tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# --- Seguridad / JWT ---
app.seguridad.jwt-secreto=${JWT_SECRET}
app.seguridad.access-ttl=15m
app.seguridad.refresh-ttl=30d
app.seguridad.codigo-ttl=15m
app.seguridad.codigos-por-ventana=3
# Login: 5 fallos seguidos bloquean la cuenta 15 min; 20 fallos desde una IP la frenan 15 min
app.seguridad.login-max-intentos=5
app.seguridad.login-bloqueo=15m
app.seguridad.login-max-fallos-ip=20

# Primer administrador (solo se usa si no existe ninguno)
app.admin-inicial.username=${ADMIN_USERNAME:}
app.admin-inicial.correo=${ADMIN_CORREO:}
app.admin-inicial.password=${ADMIN_PASSWORD:}

# --- Correo (SMTP) ---
# Sin MAIL_HOST el correo se escribe en el log (modo desarrollo).
# Amazon SES:  MAIL_HOST=email-smtp.us-east-1.amazonaws.com  MAIL_PORT=587
# Gmail:       MAIL_HOST=smtp.gmail.com  MAIL_PORT=587  (contraseña de aplicación)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.correo.remitente=${MAIL_FROM:Quiniela Liga MX <no-responder@localhost>}

# --- CORS: dominio(s) del front en producción, separados por coma ---
app.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# --- Servidor ---
server.port=${PORT:8080}
# Detrás de un proxy/balanceador, toma la IP real del cliente de X-Forwarded-For (solo de proxies de red interna)
server.forward-headers-strategy=native

# --- Actuator (solo health para el balanceador / monitoreo) ---
management.endpoints.web.exposure.include=health

# Comprobantes de pago (imágenes o PDF, máx 10 MB). En producción apunta a un volumen persistente.
app.archivos.dir=${ARCHIVOS_DIR:./datos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
